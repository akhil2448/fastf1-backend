name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/akhil2448/pitwall-backend:latest
            ghcr.io/akhil2448/pitwall-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            set -e

            IMAGE="ghcr.io/akhil2448/pitwall-backend:${{ github.sha }}"
            CONTAINER="pitwall-backend-v1"

            echo "========================================"
            echo "Starting deployment"
            echo "New image: $IMAGE"
            echo "========================================"

            echo "Checking current production container..."

            if docker inspect "$CONTAINER" >/dev/null 2>&1; then
              CURRENT_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER")
              echo "Current image: $CURRENT_IMAGE"
            else
              CURRENT_IMAGE=""
              echo "No existing production container found."
            fi

            echo "Pulling new image..."
            docker pull "$IMAGE"

            echo "Stopping current container..."
            docker stop "$CONTAINER" 2>/dev/null || true

            echo "Removing current container..."
            docker rm "$CONTAINER" 2>/dev/null || true

            echo "Starting new production container..."
            docker run -d \
              --name "$CONTAINER" \
              -p 8000:8000 \
              -e ENV=production \
              -e FASTF1_CACHE_DIR=/app/cache \
              -e FRONTEND_URL=https://pitwallf1.pages.dev \
              -e LOG_LEVEL=INFO \
              -v /opt/pitwall/cache:/app/cache \
              --restart unless-stopped \
              "$IMAGE"

            echo "Waiting for application startup..."
            sleep 5

            echo "Testing new deployment..."

            if curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health; then

              echo "========================================"
              echo "Production deployment successful!"
              echo "Running image: $IMAGE"
              echo "========================================"

            else

              echo "========================================"
              echo "NEW DEPLOYMENT FAILED"
              echo "Starting automatic rollback..."
              echo "========================================"

              echo "New container logs:"
              docker logs --tail 50 "$CONTAINER" || true

              echo "Stopping failed container..."
              docker stop "$CONTAINER" 2>/dev/null || true

              echo "Removing failed container..."
              docker rm "$CONTAINER" 2>/dev/null || true

              if [ -z "$CURRENT_IMAGE" ]; then
                echo "No previous image available for rollback."
                exit 1
              fi

              echo "Rolling back to:"
              echo "$CURRENT_IMAGE"

              echo "Pulling previous image..."
              docker pull "$CURRENT_IMAGE"

              echo "Starting previous production image..."
              docker run -d \
                --name "$CONTAINER" \
                -p 8000:8000 \
                -e ENV=production \
                -e FASTF1_CACHE_DIR=/app/cache \
                -e FRONTEND_URL=https://pitwallf1.pages.dev \
                -e LOG_LEVEL=INFO \
                -v /opt/pitwall/cache:/app/cache \
                --restart unless-stopped \
                "$CURRENT_IMAGE"

              echo "Waiting for rollback..."
              sleep 5

              echo "Testing rollback..."

              if curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health; then

                echo "========================================"
                echo "ROLLBACK SUCCESSFUL"
                echo "Production restored to:"
                echo "$CURRENT_IMAGE"
                echo "========================================"

                exit 1

              else

                echo "========================================"
                echo "CRITICAL: ROLLBACK FAILED"
                echo "========================================"

                docker logs --tail 50 "$CONTAINER" || true

                exit 1
              fi
            fi
