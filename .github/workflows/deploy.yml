name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/akhil2448/pitwall-backend:latest
            ghcr.io/akhil2448/pitwall-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            set -e

            IMAGE="ghcr.io/akhil2448/pitwall-backend:${{ github.sha }}"
            CONTAINER="pitwall-backend-v1"

            echo "========================================"
            echo "Deploying: $IMAGE"
            echo "========================================"

            echo "Pulling new image..."
            docker pull "$IMAGE"

            echo "Stopping current container..."
            docker stop "$CONTAINER" 2>/dev/null || true

            echo "Removing current container..."
            docker rm "$CONTAINER" 2>/dev/null || true

            echo "Starting new production container..."
            docker run -d \
              --name "$CONTAINER" \
              -p 8000:8000 \
              -e ENV=production \
              -e FASTF1_CACHE_DIR=/app/cache \
              -e FRONTEND_URL=https://pitwallf1.pages.dev \
              -e LOG_LEVEL=INFO \
              -v /opt/pitwall/cache:/app/cache \
              --restart unless-stopped \
              "$IMAGE"

            echo "Waiting for application startup..."
            sleep 5

            echo "Container status:"
            docker ps --filter "name=$CONTAINER"

            echo "Testing health endpoint..."
            curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health

            echo "========================================"
            echo "Production deployment successful!"
            echo "========================================"
