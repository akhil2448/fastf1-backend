name: Test Oracle Deployment

on:
  workflow_dispatch:

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy test container to Oracle
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            set -e

            IMAGE="ghcr.io/akhil2448/pitwall-backend:${{ github.sha }}"
            CONTAINER="pitwall-backend-test"

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "Removing previous test container if it exists..."
            docker rm -f "$CONTAINER" 2>/dev/null || true

            echo "Starting test container..."
            docker run -d \
              --name "$CONTAINER" \
              -p 8002:8000 \
              -e ENV=production \
              -e FASTF1_CACHE_DIR=/app/cache \
              -e FRONTEND_URL=https://pitwallf1.pages.dev \
              -e LOG_LEVEL=INFO \
              -v /opt/pitwall/cache:/app/cache \
              --restart no \
              "$IMAGE"

            echo "Waiting for application..."
            sleep 5

            echo "Container status:"
            docker ps --filter "name=$CONTAINER"

            echo "Testing health endpoint..."
            curl --fail http://localhost:8002/health

            echo "Test deployment succeeded!"

            echo "Removing test container..."
            docker rm -f "$CONTAINER"
